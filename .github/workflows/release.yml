name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the artifacts only (skip PyPI, the MCP registry, the GitHub release and the image)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # A manual dispatch defaults to a build-only rehearsal: publishing needs
    # the pypi environment's OIDC trust, which a dry run must not touch.
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Read the version, and check what is already published
        id: seen
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          on_pypi=false
          if curl -fsS "https://pypi.org/pypi/mcpify-openapi/${version}/json" >/dev/null 2>&1; then
            on_pypi=true
            echo "mcpify-openapi ${version} is already on PyPI — skipping the upload."
          fi
          echo "on_pypi=${on_pypi}" >> "$GITHUB_OUTPUT"
          in_registry=false
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers/io.github.furkan708%2Fmcpify/versions/${version}" >/dev/null 2>&1; then
            in_registry=true
            echo "MCP registry already lists ${version} — skipping the manifest publish."
          fi
          echo "in_registry=${in_registry}" >> "$GITHUB_OUTPUT"
      # A tag can be re-cut (a history rewrite, a moved tag, a re-run after a
      # failure) without re-publishing the same files: PyPI rejects duplicate
      # filenames outright, so that one 400 turned a green release red twice.
      - name: Publish to PyPI
        if: steps.seen.outputs.on_pypi == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      # Neither PyPI nor the MCP registry accepts the same version twice, so a
      # re-cut tag (rewritten history, a moved tag, a re-run) must skip the
      # half that already landed instead of failing on it. Both checks read
      # the version from pyproject — never the tag name, which can disagree
      # with the code when a tag is re-cut by hand.
      - name: Publish to MCP Registry
        if: steps.seen.outputs.in_registry == 'false'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Summary
        run: |
          echo "version ${{ steps.seen.outputs.version }} — PyPI: on_pypi=${{ steps.seen.outputs.on_pypi }}, registry: in_registry=${{ steps.seen.outputs.in_registry }}" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
