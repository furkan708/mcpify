[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpify-openapi"  # "mcpify" on PyPI is an unrelated package; CLI command stays `mcpify`
version = "1.6.2"
description = "Turn any OpenAPI REST API into an MCP server so AI agents can call it — a focused, production-ready CLI with zero runtime dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "openapi", "swagger", "ai-agents", "claude", "rest", "api", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.3"]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.4", "mypy>=2.3.1", "types-PyYAML", "pyyaml>=6.0.3"]


[project.scripts]
mcpify = "mcpify.cli:main"

[tool.setuptools.packages.find]
include = ["mcpify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["mcpify"]

[tool.coverage.report]
show_missing = true
precision = 1
